services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/easygenerator_auth}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PORT: ${PORT:-3000}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
